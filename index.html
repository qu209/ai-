<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小手机推送测试</title>
    <style>
        body { font-family: sans-serif; padding: 20px; text-align: center; }
        button { padding: 15px 30px; font-size: 18px; border-radius: 10px; background-color: #007AFF; color: white; border: none; cursor: pointer; }
        button:active { background-color: #0056b3; }
        #status { margin-top: 20px; color: #333; line-height: 1.6; text-align: left; background: #f0f0f0; padding: 15px; border-radius: 8px; white-space: pre-wrap; }
    </style>
</head>
<body>
    <h2>小手机：AI 消息推送到 Bark</h2>
    <button id="sendBtn">生成AI消息并推送到手机</button>
    <div id="status">等待操作...</div>

    <script>
        // ================= 配置区 =================
        // 警告：纯前端调用 AI 仅限个人测试！公开部署会导致你的 Key 被盗刷！
        const AI_API_KEY = "sk-你的_AI_API_KEY"; 
        const AI_API_URL = "https://api.openai.com/v1/chat/completions"; // 这里以标准 OpenAI 格式为例，按需替换
        const MAKE_WEBHOOK_URL = "https://hook.us1.make.com/你的Webhook地址";
        const BARK_KEY = "你的_Bark_Key"; 
        // ==========================================

        document.getElementById('sendBtn').addEventListener('click', async () => {
            const statusEl = document.getElementById('status');
            statusEl.innerText = "1. 正在呼叫 AI 生成内容 (可能需要几秒钟)...";

            try {
                // 1. 调用 AI 接口 
                const aiResponse = await fetch(AI_API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${AI_API_KEY}`
                    },
                    body: JSON.stringify({
                        model: "gpt-3.5-turbo", // 替换为你具体使用的 AI 模型名称
                        messages: [{"role": "user", "content": "用一句简短幽默的话提醒我喝水，不超过20个字。"}],
                        temperature: 0.7
                    })
                });

                if (!aiResponse.ok) throw new Error("AI 接口请求失败，请检查 API Key 或网络");

                const aiData = await aiResponse.json();
                const messageContent = aiData.choices[0].message.content;
                statusEl.innerText = `✅ AI 回复: "${messageContent}"\n\n2. 正在将数据发送给 Make.com Webhook...`;

                // 2. 将 AI 生成的内容发给 Make.com 的 Webhook
                const makeResponse = await fetch(MAKE_WEBHOOK_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        title: "小手机AI提醒",
                        body: messageContent,
                        barkKey: BARK_KEY
                    })
                });

                if (makeResponse.ok) {
                    statusEl.innerText += "\n\n✅ 成功发送到云端！请去 Make.com 完成最后一步配置。";
                } else {
                    statusEl.innerText += "\n\n❌ Make Webhook 请求失败。";
                }

            } catch (error) {
                statusEl.innerText += `\n\n❌ 发生错误: ${error.message}`;
            }
        });
    </script>
</body>
</html>
